version: '3.9'

services:
  postgres:
    container_name: dataverse_db
    image: postgres:13
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-12345}
      POSTGRES_DB: dataverse-dev
    volumes:
      - ${HOME}/postgres-data:/var/lib/postgresql/data
    ports:
      - 5432:5432
    restart: unless-stopped
